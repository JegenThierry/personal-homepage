services:
  personal-homepage:
    container_name: personal-homepage
    image: ghcr.io/jegenthierry/personal-homepage:latest
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.personal-homepage.rule: Host(`thierry.beer`) || Host(`www.thierry.beer`)
      traefik.http.routers.personal-homepage.entrypoints: websecure
      traefik.http.routers.personal-homepage.tls: true
      traefik.http.routers.personal-homepage.tls.certresolver: letsencrypt
      traefik.http.routers.personal-homepage.service: personal-homepage
      traefik.http.services.personal-homepage.loadbalancer.server.port: "80"
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true
