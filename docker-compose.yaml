services:
  personal-homepage:
    container_name: personal-homepage
    build:
      context: .
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.personal-homepage.rule: Host(`thierry.beer`, `www.thierry.beer`)
      traefik.http.routers.personal-homepage.entrypoints: web
      traefik.http.routers.personal-homepage.tls: true
      traefik.http.routers.personal-homepage.tls.certresolver: letsencrypt
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - traefik-network
